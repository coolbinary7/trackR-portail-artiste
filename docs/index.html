<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>trackR — Portail artiste · Démo</title><link rel="icon" href="./favicon.svg"><link rel="stylesheet" href="./demo.css"></head><body><div class="demo-banner"><b>DÉMO</b><span>Données fictives · aucun envoi réel</span><a href="#login">Écran d’accueil</a><a href="#dashboard">Dashboard</a><a href="#guides">Guides</a></div><div id="root"><p class="demo-loading">Chargement de la démonstration trackR…</p></div><div id="demo-toast" class="demo-toast" role="status" hidden></div><script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script><script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script><script>document.addEventListener('click',e=>{const link=e.target.closest('a');if(!link)return;const href=link.getAttribute('href')||'';if(href==='#dashboard')window.dispatchEvent(new Event('demo-dashboard'));if(href.startsWith('mailto:')||href.startsWith('/api')){e.preventDefault();const el=document.getElementById('demo-toast');el.textContent='Démonstration : aucun message envoyé.';el.hidden=false;setTimeout(()=>el.hidden=true,3000)}});</script><script src="./demo.js"></script><noscript>Activez JavaScript pour afficher la démonstration.</noscript></body></html>
